name: Eval and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-and-test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run golden-set eval (real LLM calls)
        run: python eval_harness.py

      - name: Run deterministic unit tests
        working-directory: tests
        run: |
          python test_mcp_layer.py
          python test_memory_layer.py
          python test_memory_wiring.py
          python test_mlflow_setup.py
          python test_eval_harness.py
